[tool.ruff]
# Longitud de línea
line-length = 120
target-version = "py310"

fix = true

[tool.ruff.lint]
# Habilitamos validaciones de errores (E, F) y el ordenamiento de imports (I)
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"alembic/env.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
